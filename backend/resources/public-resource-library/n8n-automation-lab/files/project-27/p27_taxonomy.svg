<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390"><defs><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-opacity=".08"/></filter></defs><rect width="100%" height="100%" rx="28" fill="#fff8f5"/><text x="55" y="58" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#2a1716">Failure taxonomy</text><text x="55" y="88" font-family="Arial,sans-serif" font-size="15" fill="#7b625f">Classification decides policy; it does not excuse unsafe retries</text><g filter="url(#s)"><rect x="55.0" y="132.0" width="256.0" height="97.0" rx="17" fill="#fff" stroke="#f1ddd8"/><rect x="55.0" y="132.0" width="8" height="97.0" rx="4" fill="#f59e0b"/><text x="79.0" y="169.0" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#2a1716">TRANSIENT</text><text x="79.0" y="197.0" font-family="Arial,sans-serif" font-size="13.5" fill="#7b625f">timeout / 502 / 503</text></g><g filter="url(#s)"><rect x="333.0" y="132.0" width="256.0" height="97.0" rx="17" fill="#fff" stroke="#f1ddd8"/><rect x="333.0" y="132.0" width="8" height="97.0" rx="4" fill="#ef4444"/><text x="357.0" y="169.0" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#2a1716">RATE LIMIT</text><text x="357.0" y="197.0" font-family="Arial,sans-serif" font-size="13.5" fill="#7b625f">429 / quota window</text></g><g filter="url(#s)"><rect x="611.0" y="132.0" width="256.0" height="97.0" rx="17" fill="#fff" stroke="#f1ddd8"/><rect x="611.0" y="132.0" width="8" height="97.0" rx="4" fill="#ef4444"/><text x="635.0" y="169.0" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#2a1716">AUTH</text><text x="635.0" y="197.0" font-family="Arial,sans-serif" font-size="13.5" fill="#7b625f">401 / 403</text></g><g filter="url(#s)"><rect x="889.0" y="132.0" width="256.0" height="97.0" rx="17" fill="#fff" stroke="#f1ddd8"/><rect x="889.0" y="132.0" width="8" height="97.0" rx="4" fill="#f59e0b"/><text x="913.0" y="169.0" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#2a1716">VALIDATION</text><text x="913.0" y="197.0" font-family="Arial,sans-serif" font-size="13.5" fill="#7b625f">bad input / 400</text></g><g filter="url(#s)"><rect x="55.0" y="251.0" width="256.0" height="97.0" rx="17" fill="#fff" stroke="#f1ddd8"/><rect x="55.0" y="251.0" width="8" height="97.0" rx="4" fill="#ef4444"/><text x="79.0" y="288.0" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#2a1716">BUSINESS</text><text x="79.0" y="316.0" font-family="Arial,sans-serif" font-size="13.5" fill="#7b625f">rule says stop</text></g><g filter="url(#s)"><rect x="333.0" y="251.0" width="256.0" height="97.0" rx="17" fill="#fff" stroke="#f1ddd8"/><rect x="333.0" y="251.0" width="8" height="97.0" rx="4" fill="#ef4444"/><text x="357.0" y="288.0" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#2a1716">RESOURCE</text><text x="357.0" y="316.0" font-family="Arial,sans-serif" font-size="13.5" fill="#7b625f">memory / concurrency</text></g><g filter="url(#s)"><rect x="611.0" y="251.0" width="256.0" height="97.0" rx="17" fill="#fff" stroke="#f1ddd8"/><rect x="611.0" y="251.0" width="8" height="97.0" rx="4" fill="#f59e0b"/><text x="635.0" y="288.0" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#2a1716">DEPENDENCY</text><text x="635.0" y="316.0" font-family="Arial,sans-serif" font-size="13.5" fill="#7b625f">upstream unavailable</text></g><g filter="url(#s)"><rect x="889.0" y="251.0" width="256.0" height="97.0" rx="17" fill="#fff" stroke="#f1ddd8"/><rect x="889.0" y="251.0" width="8" height="97.0" rx="4" fill="#ef4444"/><text x="913.0" y="288.0" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#2a1716">UNKNOWN</text><text x="913.0" y="316.0" font-family="Arial,sans-serif" font-size="13.5" fill="#7b625f">human review</text></g></svg>