<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390"><defs><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-opacity=".08"/></filter></defs><rect width="100%" height="100%" rx="28" fill="#fff8f5"/><text x="55" y="58" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#2a1716">Auto-retry safety test</text><text x="55" y="88" font-family="Arial,sans-serif" font-size="15" fill="#7b625f">A retryable technical error does not automatically make the business action retry-safe</text><g filter="url(#s)"><rect x="55.0" y="132.0" width="348.7" height="97.0" rx="17" fill="#fff" stroke="#f1ddd8"/><rect x="55.0" y="132.0" width="8" height="97.0" rx="4" fill="#f59e0b"/><text x="79.0" y="169.0" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#2a1716">CREATE</text><text x="79.0" y="197.0" font-family="Arial,sans-serif" font-size="13.5" fill="#7b625f">needs idempotency key</text></g><g filter="url(#s)"><rect x="425.7" y="132.0" width="348.7" height="97.0" rx="17" fill="#fff" stroke="#f1ddd8"/><rect x="425.7" y="132.0" width="8" height="97.0" rx="4" fill="#ef4444"/><text x="449.7" y="169.0" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#2a1716">SEND</text><text x="449.7" y="197.0" font-family="Arial,sans-serif" font-size="13.5" fill="#7b625f">send-once checkpoint</text></g><g filter="url(#s)"><rect x="796.3" y="132.0" width="348.7" height="97.0" rx="17" fill="#fff" stroke="#f1ddd8"/><rect x="796.3" y="132.0" width="8" height="97.0" rx="4" fill="#ef4444"/><text x="820.3" y="169.0" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#2a1716">UPDATE</text><text x="820.3" y="197.0" font-family="Arial,sans-serif" font-size="13.5" fill="#7b625f">usually safer</text></g><g filter="url(#s)"><rect x="55.0" y="251.0" width="348.7" height="97.0" rx="17" fill="#fff" stroke="#f1ddd8"/><rect x="55.0" y="251.0" width="8" height="97.0" rx="4" fill="#f59e0b"/><text x="79.0" y="288.0" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#2a1716">DELETE</text><text x="79.0" y="316.0" font-family="Arial,sans-serif" font-size="13.5" fill="#7b625f">verify contract</text></g><g filter="url(#s)"><rect x="425.7" y="251.0" width="348.7" height="97.0" rx="17" fill="#fff" stroke="#f1ddd8"/><rect x="425.7" y="251.0" width="8" height="97.0" rx="4" fill="#ef4444"/><text x="449.7" y="288.0" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#2a1716">CHARGE</text><text x="449.7" y="316.0" font-family="Arial,sans-serif" font-size="13.5" fill="#7b625f">never blind retry</text></g><g filter="url(#s)"><rect x="796.3" y="251.0" width="348.7" height="97.0" rx="17" fill="#fff" stroke="#f1ddd8"/><rect x="796.3" y="251.0" width="8" height="97.0" rx="4" fill="#ef4444"/><text x="820.3" y="288.0" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#2a1716">PROVISION</text><text x="820.3" y="316.0" font-family="Arial,sans-serif" font-size="13.5" fill="#7b625f">checkpoint first</text></g></svg>