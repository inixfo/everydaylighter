<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380"><defs><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-opacity=".09"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#db2777"/></marker></defs><rect width="100%" height="100%" rx="28" fill="#fff8fb"/><text x="55" y="62" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#30152a">Request once — response once</text><text x="55" y="91" font-family="Arial,sans-serif" font-size="15" fill="#7a5a70">Business action once, even if executions repeat</text><g filter="url(#s)"><rect x="55.0" y="155" width="241.0" height="105" rx="18" fill="#fff" stroke="#ecd9e4"/><rect x="55.0" y="155" width="8" height="105" rx="4" fill="#fb923c"/><text x="79.0" y="197" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#30152a">Same key</text><text x="79.0" y="227" font-family="Arial,sans-serif" font-size="14" fill="#7a5a70">opaque UUID</text></g><line x1="300.0" y1="207.5" x2="330.0" y2="207.5" stroke="#db2777" stroke-width="4" marker-end="url(#a)"/><g filter="url(#s)"><rect x="338.0" y="155" width="241.0" height="105" rx="18" fill="#fff" stroke="#ecd9e4"/><rect x="338.0" y="155" width="8" height="105" rx="4" fill="#db2777"/><text x="362.0" y="197" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#30152a">Lookup</text><text x="362.0" y="227" font-family="Arial,sans-serif" font-size="14" fill="#7a5a70">feedback_state</text></g><line x1="583.0" y1="207.5" x2="613.0" y2="207.5" stroke="#db2777" stroke-width="4" marker-end="url(#a)"/><g filter="url(#s)"><rect x="621.0" y="155" width="241.0" height="105" rx="18" fill="#fff" stroke="#ecd9e4"/><rect x="621.0" y="155" width="8" height="105" rx="4" fill="#db2777"/><text x="645.0" y="197" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#30152a">Requested?</text><text x="645.0" y="227" font-family="Arial,sans-serif" font-size="14" fill="#7a5a70">skip duplicate</text></g><line x1="866.0" y1="207.5" x2="896.0" y2="207.5" stroke="#db2777" stroke-width="4" marker-end="url(#a)"/><g filter="url(#s)"><rect x="904.0" y="155" width="241.0" height="105" rx="18" fill="#fff" stroke="#ecd9e4"/><rect x="904.0" y="155" width="8" height="105" rx="4" fill="#fb923c"/><text x="928.0" y="197" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#30152a">Responded?</text><text x="928.0" y="227" font-family="Arial,sans-serif" font-size="14" fill="#7a5a70">reuse / review</text></g></svg>