<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380"><rect width="100%" height="100%" rx="26" fill="#f8faf9"/><style>text{font-family:Arial, sans-serif;fill:#18212b}.t{font-weight:700}.s{font-size:14px;fill:#68717c}.m{font-size:16px}.b{font-size:20px;font-weight:700}</style><text x="40" y="52" class="b">Test in minutes, not days</text><rect x="70" y="120" width="240" height="115" rx="16" fill="#fff" stroke="#dfe3e6"/><rect x="70" y="120" width="7" height="115" rx="3" fill="#3b82f6"/><text x="92" y="152" class="t m">Test Mode</text><text x="92" y="176" class="s">1 min → 2 min → 4 min</text><line x1="310" y1="178" x2="440" y2="178" stroke="#8aa0a8" stroke-width="4" stroke-linecap="round"/><polygon points="440,178 428,171 428,185" fill="#8aa0a8"/><rect x="440" y="120" width="380" height="115" rx="16" fill="#fff" stroke="#dfe3e6"/><rect x="440" y="120" width="7" height="115" rx="3" fill="#10b981"/><text x="462" y="152" class="t m">Production</text><text x="462" y="176" class="s">1 day → 2 days → 4 days</text></svg>