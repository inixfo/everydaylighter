<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380"><rect width="100%" height="100%" rx="26" fill="#f8faf9"/><style>text{font-family:Arial, sans-serif;fill:#18212b}.t{font-weight:700}.s{font-size:14px;fill:#68717c}.m{font-size:16px}.b{font-size:20px;font-weight:700}</style><text x="40" y="52" class="b">Measure the sequence, not just sends</text><rect x="60" y="105" width="180" height="150" rx="18" fill="#fff" stroke="#dfe3e6"/><text x="150" y="155" text-anchor="middle" class="b">Reply %</text><text x="150" y="205" text-anchor="middle" style="font-family:Arial;font-size:34px;font-weight:700;fill:#10b981">31%</text><rect x="270" y="105" width="180" height="150" rx="18" fill="#fff" stroke="#dfe3e6"/><text x="360" y="155" text-anchor="middle" class="b">Meetings</text><text x="360" y="205" text-anchor="middle" style="font-family:Arial;font-size:34px;font-weight:700;fill:#3b82f6">12%</text><rect x="480" y="105" width="180" height="150" rx="18" fill="#fff" stroke="#dfe3e6"/><text x="570" y="155" text-anchor="middle" class="b">Opt-outs</text><text x="570" y="205" text-anchor="middle" style="font-family:Arial;font-size:34px;font-weight:700;fill:#ef4444">2%</text><rect x="690" y="105" width="150" height="150" rx="18" fill="#fff" stroke="#dfe3e6"/><text x="765" y="155" text-anchor="middle" class="b">Stops</text><text x="765" y="205" text-anchor="middle" style="font-family:Arial;font-size:34px;font-weight:700;fill:#8b5cf6">48</text></svg>