<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380"><rect width="100%" height="100%" rx="26" fill="#f8faf9"/><style>text{font-family:Arial, sans-serif;fill:#18212b}.t{font-weight:700}.s{font-size:14px;fill:#68717c}.m{font-size:16px}.b{font-size:20px;font-weight:700}</style><text x="40" y="52" class="b">Gmail Trigger</text><rect x="70" y="100" width="260" height="160" rx="16" fill="#fff" stroke="#dfe3e6"/><rect x="70" y="100" width="7" height="160" rx="3" fill="#3b82f6"/><text x="92" y="132" class="t m">On Message Received</text><text x="92" y="156" class="s">Poll inbox for new messages</text><rect x="440" y="100" width="380" height="160" rx="16" fill="#fff" stroke="#dfe3e6"/><rect x="440" y="100" width="7" height="160" rx="3" fill="#10b981"/><text x="462" y="132" class="t m">Useful filter idea</text><text x="462" y="156" class="s">Exclude sent/draft; focus on inbox replies</text><text x="470" y="205" class="t m">-in:sent -in:draft</text></svg>