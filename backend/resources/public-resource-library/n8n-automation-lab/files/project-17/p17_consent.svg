<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560"><rect width="100%" height="100%" rx="28" fill="#f8fafc"/><text x="55" y="58" font-family="Arial,sans-serif" font-size="28" font-weight="800" fill="#111827">Lead Capture ≠ Marketing Consent</text><text x="55" y="86" font-family="Arial,sans-serif" font-size="15" fill="#667085">Inquiry data আর marketing permission আলাদা রাখুন</text><rect x="75" y="165" width="400" height="150" rx="20" fill="white" stroke="#d9e1eb" stroke-width="2"/><rect x="75" y="165" width="8" height="150" rx="4" fill="#3b82f6"/><text x="101" y="200" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#111827">Lead Inquiry</text><text x="101" y="227" font-family="Arial,sans-serif" font-size="14" fill="#667085">“আমার quote দরকার”</text><rect x="625" y="165" width="400" height="150" rx="20" fill="white" stroke="#d9e1eb" stroke-width="2"/><rect x="625" y="165" width="8" height="150" rx="4" fill="#22a06b"/><text x="651" y="200" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#111827">Marketing Consent</text><text x="651" y="227" font-family="Arial,sans-serif" font-size="14" fill="#667085">“offers/newsletter পাঠাতে পারেন”</text><text x="415" y="405" font-family="Arial" font-size="24" font-weight="800" fill="#111827">Store separately. Respect separately.</text></svg>