<!doctype html><html><head><meta charset="utf-8"><title>Lead Form Demo</title><style>body{font-family:system-ui;background:#f4f6fb;padding:40px}.card{max-width:520px;margin:auto;background:#fff;padding:26px;border-radius:18px;box-shadow:0 18px 45px #0001}input,select,textarea,button{width:100%;box-sizing:border-box;margin:7px 0;padding:12px;border:1px solid #d7dce5;border-radius:10px}button{background:#2563eb;color:#fff;border:0;font-weight:700}</style></head><body><div class="card"><h2>Request a Callback</h2><form id="lead"><input name="full_name" placeholder="Full name" required><input name="email" type="email" placeholder="Email"><input name="phone" placeholder="Phone"><select name="service"><option>AI Automation</option><option>Website</option><option>Server Support</option></select><textarea name="message" placeholder="What do you need?"></textarea><label><input type="checkbox" name="consent_marketing" style="width:auto"> I want occasional offers and updates</label><button>Send</button></form><p id="status"></p></div><script>const WEBHOOK_URL='PASTE_YOUR_N8N_PRODUCTION_WEBHOOK_URL';document.querySelector('#lead').addEventListener('submit',async(e)=>{e.preventDefault();const f=new FormData(e.target);const body=Object.fromEntries(f.entries());body.consent_marketing=f.get('consent_marketing')==='on';body.source='website';body.source_lead_id='WEB-'+crypto.randomUUID();body.utm_source=new URLSearchParams(location.search).get('utm_source')||'direct';body.utm_campaign=new URLSearchParams(location.search).get('utm_campaign')||'';const r=await fetch(WEBHOOK_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});document.querySelector('#status').textContent=r.ok?'Thanks — we received your request.':'Could not submit. Please try again.';});</script></body></html>
