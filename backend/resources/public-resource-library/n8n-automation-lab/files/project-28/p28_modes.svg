<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390"><defs><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-opacity=".08"/></filter></defs><rect width="100%" height="100%" rx="28" fill="#f5f9ff"/><text x="55" y="58" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#10233f">Caller execution mode</text><text x="55" y="88" font-family="Arial,sans-serif" font-size="15" fill="#60728e">Choose based on semantics, not convenience</text><g filter="url(#s)"><rect x="55.0" y="132.0" width="534.0" height="97.0" rx="17" fill="#fff" stroke="#dce8f7"/><rect x="55.0" y="132.0" width="8" height="97.0" rx="4" fill="#34d399"/><text x="79.0" y="169.0" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#10233f">EACH ITEM</text><text x="79.0" y="197.0" font-family="Arial,sans-serif" font-size="13.5" fill="#60728e">one child execution per item</text></g><g filter="url(#s)"><rect x="611.0" y="132.0" width="534.0" height="97.0" rx="17" fill="#fff" stroke="#dce8f7"/><rect x="611.0" y="132.0" width="8" height="97.0" rx="4" fill="#2563eb"/><text x="635.0" y="169.0" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#10233f">ALL ITEMS</text><text x="635.0" y="197.0" font-family="Arial,sans-serif" font-size="13.5" fill="#60728e">single child receives batch</text></g><g filter="url(#s)"><rect x="55.0" y="251.0" width="534.0" height="97.0" rx="17" fill="#fff" stroke="#dce8f7"/><rect x="55.0" y="251.0" width="8" height="97.0" rx="4" fill="#2563eb"/><text x="79.0" y="288.0" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#10233f">WAIT ON</text><text x="79.0" y="316.0" font-family="Arial,sans-serif" font-size="13.5" fill="#60728e">parent consumes output</text></g><g filter="url(#s)"><rect x="611.0" y="251.0" width="534.0" height="97.0" rx="17" fill="#fff" stroke="#dce8f7"/><rect x="611.0" y="251.0" width="8" height="97.0" rx="4" fill="#34d399"/><text x="635.0" y="288.0" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#10233f">WAIT OFF</text><text x="635.0" y="316.0" font-family="Arial,sans-serif" font-size="13.5" fill="#60728e">fire-and-continue</text></g></svg>