<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390"><defs><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-opacity=".08"/></filter></defs><rect width="100%" height="100%" rx="28" fill="#f5f9ff"/><text x="55" y="58" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#10233f">When should logic become a sub-workflow?</text><text x="55" y="88" font-family="Arial,sans-serif" font-size="15" fill="#60728e">Do not split only because the canvas looks large</text><g filter="url(#s)"><rect x="55.0" y="132.0" width="348.7" height="97.0" rx="17" fill="#fff" stroke="#dce8f7"/><rect x="55.0" y="132.0" width="8" height="97.0" rx="4" fill="#34d399"/><text x="79.0" y="169.0" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#10233f">REPEATED</text><text x="79.0" y="197.0" font-family="Arial,sans-serif" font-size="13.5" fill="#60728e">used in 2+ workflows</text></g><g filter="url(#s)"><rect x="425.7" y="132.0" width="348.7" height="97.0" rx="17" fill="#fff" stroke="#dce8f7"/><rect x="425.7" y="132.0" width="8" height="97.0" rx="4" fill="#2563eb"/><text x="449.7" y="169.0" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#10233f">COHESIVE</text><text x="449.7" y="197.0" font-family="Arial,sans-serif" font-size="13.5" fill="#60728e">one clear job</text></g><g filter="url(#s)"><rect x="796.3" y="132.0" width="348.7" height="97.0" rx="17" fill="#fff" stroke="#dce8f7"/><rect x="796.3" y="132.0" width="8" height="97.0" rx="4" fill="#2563eb"/><text x="820.3" y="169.0" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#10233f">CONTRACTABLE</text><text x="820.3" y="197.0" font-family="Arial,sans-serif" font-size="13.5" fill="#60728e">inputs/outputs are explicit</text></g><g filter="url(#s)"><rect x="55.0" y="251.0" width="348.7" height="97.0" rx="17" fill="#fff" stroke="#dce8f7"/><rect x="55.0" y="251.0" width="8" height="97.0" rx="4" fill="#34d399"/><text x="79.0" y="288.0" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#10233f">OWNABLE</text><text x="79.0" y="316.0" font-family="Arial,sans-serif" font-size="13.5" fill="#60728e">can change independently</text></g><g filter="url(#s)"><rect x="425.7" y="251.0" width="348.7" height="97.0" rx="17" fill="#fff" stroke="#dce8f7"/><rect x="425.7" y="251.0" width="8" height="97.0" rx="4" fill="#2563eb"/><text x="449.7" y="288.0" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#10233f">TESTABLE</text><text x="449.7" y="316.0" font-family="Arial,sans-serif" font-size="13.5" fill="#60728e">can test in isolation</text></g><g filter="url(#s)"><rect x="796.3" y="251.0" width="348.7" height="97.0" rx="17" fill="#fff" stroke="#dce8f7"/><rect x="796.3" y="251.0" width="8" height="97.0" rx="4" fill="#2563eb"/><text x="820.3" y="288.0" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#10233f">SECURE</text><text x="820.3" y="316.0" font-family="Arial,sans-serif" font-size="13.5" fill="#60728e">caller scope can be limited</text></g></svg>