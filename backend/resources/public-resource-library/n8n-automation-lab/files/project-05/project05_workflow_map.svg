<path d="M502 240 H567" class="line"/><polygon points="567,240 553,232 553,248" fill="#bcb7ad"/>
<g transform="translate(577 180)"><rect width="180" height="120" rx="18" class="box"/><circle cx="40" cy="36" r="19" class="purple"/><text x="29" y="42" fill="#fff" font-size="13">JS</text><text x="72" y="38" class="t md">Split Files</text><text x="22" y="78" class="t xs mut">1 attachment = 1 item</text></g>
