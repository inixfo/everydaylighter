<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500"><rect width="100%" height="100%" rx="28" fill="#f8fafc"/><text x="55" y="58" font-family="Arial,sans-serif" font-size="28" font-weight="800" fill="#111827">Fake vs Grounded Personalization</text><text x="55" y="86" font-family="Arial,sans-serif" font-size="15" fill="#667085">Personalization should be traceable to a real source</text><rect x="55" y="150" width="470" height="260" rx="22" fill="#fff7f6" stroke="#f3c8c4" stroke-width="2"/><text x="80" y="195" font-family="Arial" font-size="20" font-weight="800" fill="#b33c31">BAD</text><text x="80" y="235" font-family="Arial" font-size="15" fill="#6f4d49">“Loved your amazing recent growth…”</text><text x="80" y="270" font-family="Arial" font-size="13" fill="#6f4d49">No source. No evidence. Sounds generated.</text><text x="80" y="315" font-family="Arial" font-size="13" fill="#6f4d49">Risk: invented detail + lost trust.</text><rect x="575" y="150" width="470" height="260" rx="22" fill="#f3fbf7" stroke="#cfe9d9" stroke-width="2"/><text x="600" y="195" font-family="Arial" font-size="20" font-weight="800" fill="#176c4e">GOOD</text><text x="600" y="235" font-family="Arial" font-size="15" fill="#355f4d">“Your pricing page offers three tiers…”</text><text x="600" y="270" font-family="Arial" font-size="13" fill="#4c665a">Source saved in the lead row.</text><text x="600" y="315" font-family="Arial" font-size="13" fill="#4c665a">Connection to offer is explicit.</text></svg>