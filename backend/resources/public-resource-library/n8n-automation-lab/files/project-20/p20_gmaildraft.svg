<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520"><rect width="100%" height="100%" rx="28" fill="#f8fafc"/><text x="55" y="58" font-family="Arial,sans-serif" font-size="28" font-weight="800" fill="#111827">Gmail Draft Result</text><text x="55" y="86" font-family="Arial,sans-serif" font-size="15" fill="#667085">Recipient + subject + concise body, still waiting for a human</text><rect x="120" y="130" width="860" height="310" rx="22" fill="white" stroke="#d9e1eb" stroke-width="2"/><text x="150" y="175" font-family="Arial" font-size="14" fill="#667085">To: owner@example.com</text><text x="150" y="210" font-family="Arial" font-size="18" font-weight="800" fill="#111827">Subject: Quick idea for your lead follow-up</text><line x1="150" y1="230" x2="950" y2="230" stroke="#e5e7eb"/><text x="150" y="270" font-family="Arial" font-size="14" fill="#374151">Hi Sam — I noticed your site routes quote requests through a single form.</text><text x="150" y="302" font-family="Arial" font-size="14" fill="#374151">We build n8n workflows that qualify and notify sales automatically.</text><text x="150" y="334" font-family="Arial" font-size="14" fill="#374151">Would a 10-minute workflow sketch be useful?</text><text x="150" y="385" font-family="Arial" font-size="12" fill="#667085">If this isn't relevant, reply “no” and I won't follow up.</text></svg>