<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520"><rect width="100%" height="100%" rx="28" fill="#f8fafc"/><text x="55" y="58" font-family="Arial,sans-serif" font-size="28" font-weight="800" fill="#111827">What This Project Does / Does Not Do</text><text x="55" y="86" font-family="Arial,sans-serif" font-size="15" fill="#667085">Personalized business outreach ≠ uncontrolled bulk spam</text><rect x="55" y="145" width="470" height="135" rx="20" fill="white" stroke="#d9e1eb" stroke-width="2"/><rect x="55" y="145" width="9" height="135" rx="5" fill="#22a06b"/><text x="83" y="183" font-family="Arial" font-size="18" font-weight="800" fill="#22a06b">DO</text><text x="83" y="217" font-family="Arial" font-size="16" font-weight="700" fill="#111827">Verified business context</text><text x="83" y="248" font-family="Arial" font-size="13" fill="#667085">Draft only</text><rect x="570" y="145" width="470" height="135" rx="20" fill="white" stroke="#d9e1eb" stroke-width="2"/><rect x="570" y="145" width="9" height="135" rx="5" fill="#22a06b"/><text x="598" y="183" font-family="Arial" font-size="18" font-weight="800" fill="#22a06b">DO</text><text x="598" y="217" font-family="Arial" font-size="16" font-weight="700" fill="#111827">Human approval</text><text x="598" y="248" font-family="Arial" font-size="13" fill="#667085">Clear opt-out</text><rect x="55" y="315" width="470" height="135" rx="20" fill="white" stroke="#d9e1eb" stroke-width="2"/><rect x="55" y="315" width="9" height="135" rx="5" fill="#ef4444"/><text x="83" y="353" font-family="Arial" font-size="18" font-weight="800" fill="#ef4444">DON’T</text><text x="83" y="387" font-family="Arial" font-size="16" font-weight="700" fill="#111827">Harvest private emails</text><text x="83" y="418" font-family="Arial" font-size="13" fill="#667085">Fake personalization</text><rect x="570" y="315" width="470" height="135" rx="20" fill="white" stroke="#d9e1eb" stroke-width="2"/><rect x="570" y="315" width="9" height="135" rx="5" fill="#ef4444"/><text x="598" y="353" font-family="Arial" font-size="18" font-weight="800" fill="#ef4444">DON’T</text><text x="598" y="387" font-family="Arial" font-size="16" font-weight="700" fill="#111827">Auto-send thousands</text><text x="598" y="418" font-family="Arial" font-size="13" fill="#667085">Ignore opt-outs</text></svg>