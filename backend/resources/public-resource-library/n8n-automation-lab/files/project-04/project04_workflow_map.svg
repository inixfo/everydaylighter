<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560"><style>.t{font-family:Arial,sans-serif;fill:#17181c}.mut{fill:#6f7077}.sm{font-size:14px}.xs{font-size:11px}.md{font-size:17px;font-weight:700}.b{font-weight:700}.box{fill:#fff;stroke:#dedbd4;stroke-width:1.5}.soft{fill:#f5f1ff}.dark{fill:#17181c}.purple{fill:#7756d8}.green{fill:#2a9d68}.blue{fill:#4c91d9}.red{fill:#e45a4f}.yellow{fill:#e6a229}.line{stroke:#bcb7ad;stroke-width:2;fill:none}.dash{stroke:#8f7bd4;stroke-width:2;stroke-dasharray:6 5;fill:none}.code{font-family:Consolas,monospace;fill:#6048ad;font-size:13px}</style><rect width="1100" height="560" rx="26" fill="#f8f7f3"/><text x="55" y="62" class="t md">Personalized Email Automation — workflow map</text>
