<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500"><rect width="100%" height="100%" rx="28" fill="#f8fafc"/><text x="55" y="58" font-family="Arial,sans-serif" font-size="28" font-weight="800" fill="#111827">AI Tier ≠ CRM Lifecycle Stage</text><text x="55" y="86" font-family="Arial,sans-serif" font-size="15" fill="#667085">Recommendation আর business truth এক জিনিস নয়</text><rect x="90" y="180" width="360" height="150" rx="20" fill="#faf8ff" stroke="#d9e1eb" stroke-width="2"/><rect x="90" y="180" width="8" height="150" rx="4" fill="#8b5cf6"/><text x="116" y="215" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#111827">AI Lead Tier</text><text x="116" y="242" font-family="Arial,sans-serif" font-size="14" fill="#667085">HOT / WARM / COLD / REVIEW</text><rect x="650" y="180" width="360" height="150" rx="20" fill="#f8fbff" stroke="#d9e1eb" stroke-width="2"/><rect x="650" y="180" width="8" height="150" rx="4" fill="#3b82f6"/><text x="676" y="215" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#111827">CRM Lifecycle</text><text x="676" y="242" font-family="Arial,sans-serif" font-size="14" fill="#667085">Lead / MQL / SQL / Opportunity / Customer</text><text x="475" y="260" font-family="Arial" font-size="34" font-weight="800" fill="#ef4444">≠</text><text x="330" y="405" font-family="Arial" font-size="15" font-weight="700" fill="#667085">Human/explicit business rules decide when lifecycle stage changes.</text></svg>